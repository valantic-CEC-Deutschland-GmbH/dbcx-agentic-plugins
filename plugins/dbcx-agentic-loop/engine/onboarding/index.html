<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getting started · dbcx agentic loop</title>
<style>
/* colours, type and light/dark behaviour follow the run board (../dashboard/dashboard.html) */
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --sunk:#e4e7ec;
  --ink:#14171c; --ink-2:#4a5260; --ink-3:#7a8392; --line:#d9dde4; --line-2:#e8ebef;
  --accent:#2f6fed; --accent-bg:#e6eefe;
  --queued:#9aa3b1; --analysing:#2f6fed; --critique:#7b4fd6; --passed:#1f9d61; --consol:#0f8a8a; --gate:#b07d00;
  --passed-bg:#e4f5ec; --gate-bg:#fbf1d9; --warn:#b86e00; --bad:#d23c3c;
  --r-analyst:#2f6fed; --r-client:#d9731a; --r-standard:#7b4fd6;
  --shadow:0 1px 2px rgba(20,23,28,.06),0 2px 8px rgba(20,23,28,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#181b21; --surface-2:#1e222a; --sunk:#12151a;
    --ink:#e9ecf1; --ink-2:#aab2bf; --ink-3:#7c8595; --line:#2b3039; --line-2:#232831;
    --accent:#6b9bff; --accent-bg:#1c2a45;
    --queued:#6f7888; --analysing:#6b9bff; --critique:#a88bf0; --passed:#3fc486; --consol:#35b8b8; --gate:#e0ae3a;
    --passed-bg:#15301f; --gate-bg:#2e2512; --warn:#f0a53a; --bad:#ff6b6b;
    --r-analyst:#6b9bff; --r-client:#f0913d; --r-standard:#a88bf0;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#181b21; --surface-2:#1e222a; --sunk:#12151a;
  --ink:#e9ecf1; --ink-2:#aab2bf; --ink-3:#7c8595; --line:#2b3039; --line-2:#232831;
  --accent:#6b9bff; --accent-bg:#1c2a45;
  --queued:#6f7888; --analysing:#6b9bff; --critique:#a88bf0; --passed:#3fc486; --consol:#35b8b8; --gate:#e0ae3a;
  --passed-bg:#15301f; --gate-bg:#2e2512; --warn:#f0a53a; --bad:#ff6b6b;
  --r-analyst:#6b9bff; --r-client:#f0913d; --r-standard:#a88bf0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit}
a{color:var(--accent)}
b{font-weight:650}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{flex:1 1 auto;min-width:0}
.brand .t{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .s{font-size:12.5px;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
main{max-width:1160px;margin:0 auto;padding:0 16px 40px}
section{margin-top:40px}
h1{font-size:clamp(26px,4vw,38px);line-height:1.15;letter-spacing:-.02em;margin:0 0 14px}
h2{font-size:22px;letter-spacing:-.01em;margin:0 0 6px}
h3{font-size:16px;margin:0 0 4px}
.lead{color:var(--ink-2);margin:0 0 16px;max-width:760px}
.kick{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.muted{color:var(--ink-3)}
.note{font-size:13px;color:var(--ink-3);margin:8px 0 0}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:20px;align-items:start;margin-top:28px}
.hero p.intro{margin:0 0 10px;color:var(--ink-2);max-width:680px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:3px 11px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2)}
.chips .cl{font-size:12.5px;color:var(--ink-3);align-self:center;margin-right:2px}
.chip.own{border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:600;text-decoration:none}
.chip.own:hover{background:var(--accent-bg)}
.side{display:flex;flex-direction:column;gap:14px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;text-decoration:none;box-shadow:var(--shadow);text-align:center}
.cta:hover{filter:brightness(1.08)}
.cta:focus-visible,.pr:focus-visible,.chip.own:focus-visible,.rail a:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cta svg{width:18px;height:18px;flex:0 0 auto}
.demo-card .cta{width:100%}
.demo-card .cta+.cta{margin-top:8px}
.cta.alt{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.demo-card .tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--gate);background:var(--gate-bg);border:1px dashed var(--gate);border-radius:10px;padding:1px 8px;margin-bottom:8px}

/* prompt cards */
.pr{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;margin-top:8px;padding:9px 11px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;background:var(--surface-2);cursor:pointer}
.pr:hover{border-color:var(--accent)}
.pr .q{flex:1 1 auto;min-width:0;font-size:14px;overflow-wrap:anywhere}
.pr .q::before{content:"\201C"}.pr .q::after{content:"\201D"}
.pr .c{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink-3);margin-top:1px}
.pr .c svg{width:14px;height:14px}
.pr.done{border-color:var(--passed);border-left-color:var(--passed)}
.pr.done .c{color:var(--passed)}

/* the loop */
.rail{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;counter-reset:st}
.rail li{position:relative;min-width:0}
.rail a{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);height:100%}
.rail a:hover{border-color:color-mix(in srgb,var(--c) 60%,var(--line));border-top-color:var(--c)}
.rail .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-size:12.5px;font-weight:800}
.rail .nm{display:block;font-weight:700;margin-top:6px;overflow-wrap:anywhere}
.rail .x{display:block;font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.rail li+li::before{content:"";position:absolute;left:-8px;top:24px;width:8px;height:2px;background:var(--line)}
.back{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:8px;font-size:13px;color:var(--ink-3)}
.back svg{width:30px;height:16px;flex:0 0 auto;color:var(--gate)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.step{border-top:4px solid var(--c);scroll-margin-top:70px}
.step .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.step .hd .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-size:13px;font-weight:800;flex:0 0 auto}
.step .hd .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--c)}
.step p{margin:0 0 4px;color:var(--ink-2);font-size:14px}
.flow{list-style:none;margin:10px 0 4px;padding:0;display:flex;flex-direction:column;gap:0}
.flow li{position:relative;display:flex;gap:10px;align-items:flex-start;padding:6px 0 6px 0}
.flow li+li::before{content:"";position:absolute;left:11px;top:-6px;height:12px;width:2px;background:var(--line)}
.flow .dot{flex:0 0 auto;display:inline-flex;gap:2px;width:24px;justify-content:center;margin-top:2px}
.flow .dot i{width:12px;height:12px;border-radius:50%;background:var(--rc)}
.flow .dot.two i{width:10px;height:10px}
.flow b{display:block;font-size:13.5px}
.flow span.s{display:block;font-size:12.5px;color:var(--ink-3)}

/* dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:14px;margin-top:16px;align-items:stretch}
.mini{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.gband{margin-top:12px;border-top:4px solid var(--gate);padding-top:5px}
.gband .gh{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2);margin-bottom:6px}
.gband .gh span+span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-3)}
.gband .mini{grid-template-columns:repeat(4,minmax(0,1fr))}
.gband .mini .ch{min-height:0;font-size:10.5px}
.gband .mini .cell{min-height:44px}
.pband{margin-top:12px;border-top:4px solid var(--consol);padding-top:5px}
.pband .gh{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2);margin-bottom:6px}
.pband .gh span+span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-3)}
.pm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.pm i{display:block;height:16px;border-radius:4px;background:var(--surface);border:1px solid var(--line)}
.pm i.on{background:color-mix(in srgb,var(--consol) 22%,var(--surface));border-color:color-mix(in srgb,var(--consol) 45%,var(--line))}
.pm i.ov{background:color-mix(in srgb,var(--critique) 22%,var(--surface));border-color:color-mix(in srgb,var(--critique) 45%,var(--line))}
.mini .col{min-width:0}
.mini .ch{border-top:4px solid var(--c);padding-top:5px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2);overflow-wrap:anywhere;hyphens:auto;min-height:36px}
.mini .cell{display:flex;flex-direction:column;gap:5px;padding:5px;border-radius:9px;background:color-mix(in srgb,var(--c) 8%,transparent);min-height:120px}
.mini .cell i{display:block;height:26px;border-radius:6px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c)}
.mini .cell i.q{position:relative}
.mini .cell i.q::after{content:"";position:absolute;right:4px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.feat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}
.feat ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.feat li{margin:4px 0}
.feat p{margin:0;font-size:14px;color:var(--ink-2)}
.ui{font-weight:650;color:var(--ink)}
.pair{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.pair p{margin:0 0 4px;color:var(--ink-2);font-size:14px}
.more{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
footer{max-width:1160px;margin:0 auto;padding:18px 16px 30px;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line)}

@media (max-width:1100px){
  .feat{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .hero,.dash,.pair{grid-template-columns:minmax(0,1fr)}
  .rail{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rail li:nth-child(4)::before{display:none}
  .steps,.feat{grid-template-columns:minmax(0,1fr)}
  .mini{grid-template-columns:repeat(3,minmax(0,1fr))}
  .gband .mini{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mini .cell{min-height:70px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="t" data-i="brand"></div><div class="s" data-i="brand_s"></div></div>
  <div class="seg" role="group" data-ia="aria-label:lang_label"><button data-lang="en" data-i="en"></button><button data-lang="de" data-i="de"></button></div>
</header>
<main>
  <section class="hero">
    <div>
      <p class="kick" data-i="kick"></p>
      <h1 data-i="hero_h"></h1>
      <p class="intro" data-i="hero_p1"></p>
      <p class="intro" data-i="hero_p2"></p>
      <p class="intro" data-i="hero_p3"></p>
      <div class="chips"><span class="cl" data-i="methods_l"></span><span class="chip" data-i="m1"></span><span class="chip" data-i="m2"></span><span class="chip" data-i="m3"></span><span class="chip" data-i="m4"></span><span class="chip" data-i="m5"></span><a class="chip own" href="#s1" data-i="m6"></a></div>
    </div>
    <div class="side">
      <div class="card demo-card">
        <span class="tag" data-i="demo_tag"></span>
        <h3 data-i="demo_h"></h3>
        <p class="note" style="margin:0 0 12px" data-i="demo_s"></p>
        <a class="cta" href="../dashboard/dashboard.html?demo=1" target="_blank" rel="noopener" id="demoBtn"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.8v10.4L13 8z"/></svg><span data-i="demo_btn"></span></a>
        <a class="cta alt" href="../dashboard/dashboard.html?demo=1&amp;scenario=estimate" target="_blank" rel="noopener" id="demoBtn2"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.8v10.4L13 8z"/></svg><span data-i="demo_btn2"></span></a>
      </div>
      <div class="card">
        <h3 data-i="setup_h"></h3>
        <button class="pr"><span class="q" data-i="setup_p"></span><span class="c"></span></button>
        <p class="note" data-i="where"></p>
      </div>
    </div>
  </section>

  <section id="loop">
    <h2 data-i="loop_h"></h2>
    <p class="lead" data-i="loop_p"></p>
    <ol class="rail">
      <li style="--c:var(--ink-2)"><a href="#s1"><span class="n">1</span><span class="nm" data-i="s1_n"></span><span class="x" data-i="s1_x"></span></a></li>
      <li style="--c:var(--consol)"><a href="#s2"><span class="n">2</span><span class="nm" data-i="s2_n"></span><span class="x" data-i="s2_x"></span></a></li>
      <li style="--c:var(--analysing)"><a href="#s3"><span class="n">3</span><span class="nm" data-i="s3_n"></span><span class="x" data-i="s3_x"></span></a></li>
      <li style="--c:var(--critique)"><a href="#s4"><span class="n">4</span><span class="nm" data-i="s4_n"></span><span class="x" data-i="s4_x"></span></a></li>
      <li style="--c:var(--passed)"><a href="#s5"><span class="n">5</span><span class="nm" data-i="s5_n"></span><span class="x" data-i="s5_x"></span></a></li>
      <li style="--c:var(--gate)"><a href="#s6"><span class="n">6</span><span class="nm" data-i="s6_n"></span><span class="x" data-i="s6_x"></span></a></li>
    </ol>
    <div class="back"><svg viewBox="0 0 30 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M28 3v5H4"/><path d="M8 4 4 8l4 4"/></svg><span data-i="loop_back"></span></div>
    <div class="steps">
      <article class="card step" id="s1" style="--c:var(--ink-2)">
        <div class="hd"><span class="n">1</span><span class="k" data-i="s1_n"></span></div>
        <h3 data-i="s1_t"></h3><p data-i="s1_d"></p>
        <button class="pr"><span class="q" data-i="s1_p1"></span><span class="c"></span></button>
        <button class="pr"><span class="q" data-i="s1_p2"></span><span class="c"></span></button>
        <button class="pr"><span class="q" data-i="s1_p3"></span><span class="c"></span></button>
      </article>
      <article class="card step" id="s2" style="--c:var(--consol)">
        <div class="hd"><span class="n">2</span><span class="k" data-i="s2_n"></span></div>
        <h3 data-i="s2_t"></h3><p data-i="s2_d"></p>
        <button class="pr"><span class="q" data-i="s2_p1"></span><span class="c"></span></button>
        <button class="pr"><span class="q" data-i="s2_p2"></span><span class="c"></span></button>
      </article>
      <article class="card step" id="s3" style="--c:var(--analysing)">
        <div class="hd"><span class="n">3</span><span class="k" data-i="s3_n"></span></div>
        <h3 data-i="s3_t"></h3><p data-i="s3_d"></p>
        <ol class="flow">
          <li><span class="dot" style="--rc:var(--r-analyst)"><i></i></span><span><b data-i="f1"></b><span class="s" data-i="f1_s"></span></span></li>
          <li><span class="dot two"><i style="--rc:var(--r-client)"></i><i style="--rc:var(--r-standard)"></i></span><span><b data-i="f2"></b><span class="s" data-i="f2_s"></span></span></li>
          <li><span class="dot" style="--rc:var(--passed)"><i></i></span><span><b data-i="f3"></b><span class="s" data-i="f3_s"></span></span></li>
          <li><span class="dot" style="--rc:var(--gate)"><i></i></span><span><b data-i="f4"></b><span class="s" data-i="f4_s"></span></span></li>
        </ol>
        <button class="pr"><span class="q" data-i="s3_p1"></span><span class="c"></span></button>
        <button class="pr"><span class="q" data-i="s3_p2"></span><span class="c"></span></button>
      </article>
      <article class="card step" id="s4" style="--c:var(--critique)">
        <div class="hd"><span class="n">4</span><span class="k" data-i="s4_n"></span></div>
        <h3 data-i="s4_t"></h3><p data-i="s4_d"></p>
        <button class="pr"><span class="q" data-i="s4_p1"></span><span class="c"></span></button>
        <button class="pr"><span class="q" data-i="s4_p2"></span><span class="c"></span></button>
        <button class="pr"><span class="q" data-i="s4_p3"></span><span class="c"></span></button>
        <button class="pr"><span class="q" data-i="s4_p4"></span><span class="c"></span></button>
      </article>
      <article class="card step" id="s5" style="--c:var(--passed)">
        <div class="hd"><span class="n">5</span><span class="k" data-i="s5_n"></span></div>
        <h3 data-i="s5_t"></h3><p data-i="s5_d"></p>
        <button class="pr"><span class="q" data-i="s5_p1"></span><span class="c"></span></button>
      </article>
      <article class="card step" id="s6" style="--c:var(--gate)">
        <div class="hd"><span class="n">6</span><span class="k" data-i="s6_n"></span></div>
        <h3 data-i="s6_t"></h3><p data-i="s6_d"></p>
        <button class="pr"><span class="q" data-i="s6_p1"></span><span class="c"></span></button>
        <button class="pr"><span class="q" data-i="s6_p2"></span><span class="c"></span></button>
      </article>
    </div>
    <p class="note" data-i="prompt_note"></p>
  </section>

  <section id="dashboard">
    <h2 data-i="dash_h"></h2>
    <p class="lead" data-i="dash_p"></p>
    <div class="dash">
      <div class="card" aria-hidden="true">
        <div class="mini">
          <div class="col" style="--c:var(--queued)"><div class="ch" data-i="c1"></div><div class="cell"><i></i><i></i></div></div>
          <div class="col" style="--c:var(--analysing)"><div class="ch" data-i="c2"></div><div class="cell"><i class="q"></i><i></i></div></div>
          <div class="col" style="--c:var(--critique)"><div class="ch" data-i="c3"></div><div class="cell"><i></i></div></div>
          <div class="col" style="--c:var(--passed)"><div class="ch" data-i="c4"></div><div class="cell"><i></i><i></i><i></i></div></div>
          <div class="col" style="--c:var(--consol)"><div class="ch" data-i="c5"></div><div class="cell"><i></i></div></div>
        </div>
        <div class="pband">
          <div class="gh"><span data-i="c7"></span> <span data-i="c7_s"></span></div>
          <div class="pm"><i class="on"></i><i class="on"></i><i></i><i></i><i class="on"></i><i></i><i class="ov"></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i><i></i></div>
        </div>
        <div class="gband">

  "s1_t": "Engagement und Lauf anlegen",

  "d2_c": "<span class=\"ui\">Keep assumption</span> schließt die Frage: Die Annahme bleibt in den Ergebnissen stehen, nichts wird neu analysiert, und du kannst die Frage wieder öffnen.",
  "d3_h": "Hinweise, Einwände, Feedback",
  "d3_p": "Öffne eine Karte, um den Verlauf eines Themas zu lesen. Schick dem Analysten einen Hinweis oder widersprich der Bewertung eines Kritikers – als Fakt oder als Hinweis. Im Abschluss-Gate öffnest du einen Stakeholder, um seine Bewertung je Kernfrage zu sehen; trifft eine Frage nicht, schickst du <span class=\"ui\">Feedback</span>, und der Lauf formuliert sie ab der nächsten Runde um oder streicht sie. In <span class=\"ui\">Impact per system</span> klickst du auf eine Zelle, um ein System hinzuzufügen oder zu entfernen oder den Auswirkungstext zu ändern – freiwillig: Der Lauf arbeitet bereits mit dem Entschiedenen weiter, und die nächste Welle übernimmt deine Änderung. In <span class=\"ui\">Gap decisions</span> klickst du auf die Zelle eines anderen Systems, um eine Lücke dorthin zu geben, oder änderst den Lösungstext – ebenfalls freiwillig.",

<script>
(() => {
  const T = JSON.parse(document.getElementById('i18n').textContent), KEY = 'dbcx.onboarding.lang';
  const saved = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
  const save = l => { try { localStorage.setItem(KEY, l); } catch {} };
  const ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M3 10.5V3.8C3 3.3 3.3 3 3.8 3h6.7"/></svg>';
  let lang;
  function apply(l) {
    lang = T[l] ? l : 'en'; const t = T[lang];
    document.documentElement.lang = lang; document.title = t.title;
    document.querySelectorAll('[data-i]').forEach(e => { e.innerHTML = t[e.dataset.i]; });
    document.querySelectorAll('[data-ia]').forEach(e => { const [a, k] = e.dataset.ia.split(':'); e.setAttribute(a, t[k]); });
    document.querySelectorAll('.pr .c').forEach(e => { e.innerHTML = ICON + '<span>' + t.copy + '</span>'; });
    document.querySelectorAll('.pr').forEach(e => e.classList.remove('done'));
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  }
  const q = new URLSearchParams(location.search).get('lang');
  if (T[q]) save(q);
  apply(T[q] ? q : saved() || 'en');
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { save(b.dataset.lang); apply(b.dataset.lang); }));

  function fallback(text) {   // file:// pages without the async clipboard: a hidden textarea and execCommand
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch {} ta.remove(); return ok;
  }
  document.addEventListener('click', async e => {
    const b = e.target.closest('.pr'); if (!b) return;
    const text = b.querySelector('.q').textContent.trim(); let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch { ok = fallback(text); }
    const c = b.querySelector('.c span');
    if (ok) { b.classList.add('done'); c.textContent = T[lang].copied; }
    else c.textContent = T[lang].copy_fail;
    setTimeout(() => { b.classList.remove('done'); c.textContent = T[lang].copy; }, 1800);
  });
})();
</script>
