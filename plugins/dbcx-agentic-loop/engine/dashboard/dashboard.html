<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run board</title>
<style>
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --sunk:#e4e7ec;
  --ink:#14171c; --ink-2:#4a5260; --ink-3:#7a8392; --line:#d9dde4; --line-2:#e8ebef;
  --accent:#2f6fed; --accent-bg:#e6eefe;
  --queued:#9aa3b1; --analysing:#2f6fed; --critique:#7b4fd6; --passed:#1f9d61; --consol:#0f8a8a; --gate:#b07d00;
  --analysing-bg:#e8effe; --critique-bg:#f0eafc; --passed-bg:#e4f5ec; --consol-bg:#e0f3f3; --gate-bg:#fbf1d9;
  --bad:#d23c3c; --bad-bg:#fde9e9; --warn:#b86e00; --warn-bg:#fff2d9;
  --r-analyst:#2f6fed; --r-client:#d9731a; --r-standard:#7b4fd6; --r-consol:#0f8a8a; --r-gate:#b07d00;
  --shadow:0 1px 2px rgba(20,23,28,.06),0 2px 8px rgba(20,23,28,.06);
  --shadow-lg:0 12px 40px rgba(20,23,28,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#181b21; --surface-2:#1e222a; --sunk:#12151a;
    --ink:#e9ecf1; --ink-2:#aab2bf; --ink-3:#7c8595; --line:#2b3039; --line-2:#232831;
    --accent:#6b9bff; --accent-bg:#1c2a45;
    --queued:#6f7888; --analysing:#6b9bff; --critique:#a88bf0; --passed:#3fc486; --consol:#35b8b8; --gate:#e0ae3a;
    --analysing-bg:#1a2640; --critique-bg:#251e3b; --passed-bg:#15301f; --consol-bg:#122d2e; --gate-bg:#2e2512;
    --bad:#ff6b6b; --bad-bg:#3a1b1d; --warn:#f0a53a; --warn-bg:#352711;
    --r-analyst:#6b9bff; --r-client:#f0913d; --r-standard:#a88bf0; --r-consol:#35b8b8; --r-gate:#e0ae3a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.3);
    --shadow-lg:0 12px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#181b21; --surface-2:#1e222a; --sunk:#12151a;
  --ink:#e9ecf1; --ink-2:#aab2bf; --ink-3:#7c8595; --line:#2b3039; --line-2:#232831;
  --accent:#6b9bff; --accent-bg:#1c2a45;
  --queued:#6f7888; --analysing:#6b9bff; --critique:#a88bf0; --passed:#3fc486; --consol:#35b8b8; --gate:#e0ae3a;
  --analysing-bg:#1a2640; --critique-bg:#251e3b; --passed-bg:#15301f; --consol-bg:#122d2e; --gate-bg:#2e2512;
  --bad:#ff6b6b; --bad-bg:#3a1b1d; --warn:#f0a53a; --warn-bg:#352711;
  --r-analyst:#6b9bff; --r-client:#f0913d; --r-standard:#a88bf0; --r-consol:#35b8b8; --r-gate:#e0ae3a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.3);
  --shadow-lg:0 12px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0;flex:0 0 auto}
.brand{min-width:0;flex:1 1 auto}
.brand .t{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .s{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;flex:0 0 auto}
.live i{width:8px;height:8px;border-radius:50%;background:var(--passed);box-shadow:0 0 0 0 var(--passed);animation:beat 2s infinite}
.live.paused i{background:var(--warn);animation:none}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--passed) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tb{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;white-space:nowrap;flex:0 0 auto;font-weight:500;font-size:13.5px}
.tb:hover{background:var(--surface-2)}
.tb[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.tb svg{width:16px;height:16px;flex:0 0 auto}
.tb .n{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:10px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--ink-2)}
.tb .n.new{background:var(--bad);color:#fff}
.tb.ctl-warn{border-color:var(--warn);color:var(--warn)}
.tb:disabled{opacity:.6;cursor:default}
.sep{width:1px;height:24px;background:var(--line);flex:0 0 auto}
.banner{padding:8px 16px;background:var(--warn-bg);color:var(--warn);font-size:13px;border-bottom:1px solid var(--line);flex:0 0 auto}
.banner b{color:inherit}

/* ---------- destinations strip */
.dest{display:grid;grid-template-columns:minmax(150px,.7fr) repeat(3,minmax(0,1fr)) minmax(0,1fr);gap:10px;padding:12px 16px;flex:0 0 auto}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;box-shadow:var(--shadow)}
.dcard .h{display:flex;align-items:baseline;gap:8px;min-width:0}
.dcard .nm{font-weight:600;font-size:13.5px;min-width:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .pc{font-weight:800;font-size:26px;line-height:1;letter-spacing:-.02em;flex:0 0 auto}
.dcard .ln{font-size:12px;color:var(--ink-3);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segs{display:flex;gap:3px;margin-top:8px;height:12px}
.segs i{flex:1 1 0;border-radius:3px;background:var(--sunk);min-width:4px}
.segs i.analysing{background:color-mix(in srgb,var(--analysing) 45%,var(--sunk))}
.segs i.critique{background:color-mix(in srgb,var(--critique) 55%,var(--sunk))}
.segs i.passed{background:var(--passed)}
.segs i.failed{background:var(--bad)}
.segs i.grun{background:repeating-linear-gradient(-45deg,var(--gate) 0 5px,color-mix(in srgb,var(--gate) 45%,var(--sunk)) 5px 10px)}
.segs i.consolidated{background:var(--consol)}
.segs i.cons{flex:2.2 1 0;outline:1.5px dashed var(--line);outline-offset:-1.5px;background:transparent}
.segs i.cons.analysing,.segs i.cons.critique{outline:none}
.segs i.cons.consolidated{outline:none;background:var(--consol)}
.dcard.overall{display:flex;flex-direction:column;justify-content:center;background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dcard.overall .pc{font-size:40px}
.dcard.overall .ln{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.dcard.gatec .pc{color:var(--gate)}

/* ---------- main */
.wrap{flex:1 1 auto;display:flex;min-height:0;padding:0 16px 14px;gap:12px}
.boardwrap{flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:auto}
.lanes{display:grid;grid-template-columns:minmax(130px,.72fr) minmax(150px,1.08fr) minmax(170px,1.25fr) minmax(128px,.9fr) minmax(128px,.9fr);column-gap:10px;align-content:start;min-width:760px}
.colh{position:sticky;top:0;z-index:2;background:var(--bg);padding:2px 2px 8px;min-width:0}
.colh .row{display:flex;align-items:center;gap:8px;border-top:4px solid var(--c);padding-top:7px}
.colh .nm{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.colh .ct{margin-left:auto;font-weight:800;font-size:18px;color:var(--c);flex:0 0 auto}
.colh .ex{font-size:11.5px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.laneh{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;padding:10px 2px 6px;border-bottom:1px dashed var(--line);margin-bottom:8px;min-width:0}
.laneh b{font-size:13px;white-space:nowrap}
.laneh>span{font-size:12.5px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{display:flex;flex-direction:column;gap:8px;min-height:64px;padding:6px;border-radius:12px;background:color-mix(in srgb,var(--c) 7%,transparent);min-width:0;margin-bottom:6px}
.cell:empty::after{content:"";flex:1;border:1.5px dashed color-mix(in srgb,var(--c) 30%,transparent);border-radius:9px;min-height:48px}

/* ---------- cards */
.card{position:relative;display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:9px 10px;cursor:pointer;box-shadow:var(--shadow);min-width:0;will-change:transform}
.card:hover{border-color:color-mix(in srgb,var(--c) 60%,var(--line));border-left-color:var(--c)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.sel{outline:2px solid var(--accent);outline-offset:1px}
.card .nm{font-weight:600;font-size:14.5px;line-height:1.25;overflow-wrap:break-word}
.card.compact .nm{font-size:13.5px}
.card .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{font-size:12.5px;color:var(--ink-2);margin-top:6px;overflow-wrap:anywhere}
.card .st b{color:var(--c)}
.card.failed{border-left-color:var(--bad);background:linear-gradient(0deg,var(--bad-bg),var(--bad-bg)) padding-box}
.card.failed .st b{color:var(--bad)}
.card.stall .st b{color:var(--bad)}
.qb{position:relative;float:right;margin:-2px -3px 4px 6px;display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 7px;border-radius:11px;background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:700;border:0;cursor:pointer}
.qb svg{width:13px;height:13px}
.qb.new{background:var(--bad);color:#fff}
.qb.new::after{content:"";position:absolute;inset:-3px;border-radius:14px;border:2px solid var(--bad);animation:ring 1.8s infinite}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
.dots{display:inline-flex;gap:3px;margin-right:7px;vertical-align:-1px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent}
.dots i.p{background:var(--passed);border-color:var(--passed)}
.dots i.f{background:var(--bad);border-color:var(--bad)}
.dots i.cur{border-color:var(--c);background:color-mix(in srgb,var(--c) 30%,transparent);animation:curp 1.6s infinite}
@keyframes curp{50%{background:transparent}}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 6px;align-items:center;margin-top:7px;font-size:11.5px;color:var(--ink-3)}
.bar{position:relative;height:7px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--bad)}
.bar i.ok{background:var(--passed)}
.bar::after{content:"";position:absolute;left:80%;top:-2px;bottom:-2px;width:2px;background:var(--ink-2)}
.bars .v{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bars .v.low{color:var(--bad)}
.agents{display:flex;align-items:center;gap:6px;margin-top:8px;min-width:0}
.agents .lbl{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.av{position:relative;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--rc);color:#fff;font-size:11px;font-weight:800;flex:0 0 auto;box-shadow:0 0 0 2px var(--surface)}
.av.run::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--rc);animation:ring 1.6s infinite}
.av.stalled{background:var(--bad)}
.av.stalled::before{content:"!";position:absolute;right:-4px;top:-5px;width:13px;height:13px;border-radius:50%;background:var(--surface);color:var(--bad);font-size:10px;display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--bad)}
.av.idle{background:var(--queued)}
.av-stack{display:flex}
.av-stack .av+.av{margin-left:-6px}

.gready{display:flex;flex-direction:column;gap:5px;margin:8px 0}
.gready div{display:flex;align-items:center;gap:6px;font-size:12.5px;min-width:0}
.gready div span{min-width:0;overflow-wrap:anywhere}
.gready i{width:10px;height:10px;border-radius:3px;background:var(--sunk);flex:0 0 auto}
.gready i.ok{background:var(--consol)}

/* ---------- decisions panel */
.decisions{flex:0 0 400px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-height:0;min-width:0}
.decisions[hidden]{display:none}
body.dec-overlay .decisions{position:fixed;right:12px;top:64px;bottom:12px;width:min(420px,calc(100vw - 24px));z-index:30;box-shadow:var(--shadow-lg)}
.dh{padding:12px 14px 8px;border-bottom:1px solid var(--line-2)}
.dh .r1{display:flex;align-items:center;gap:8px}
.dh h2{margin:0;font-size:15px;flex:1;min-width:0}
.x{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;font-size:18px;line-height:1;color:var(--ink-2);flex:0 0 auto}
.x:hover{background:var(--surface-2);border-color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.scopef{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.dl{flex:1 1 auto;overflow-y:auto;padding:4px 10px 12px;min-height:0}
.grp{margin-top:8px}
.grp>summary{list-style:none;display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .cv{transition:transform .15s;display:inline-block;width:10px;flex:0 0 auto;text-align:center}
.grp[open]>summary .cv{transform:rotate(90deg)}
.grp>summary .gn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp>summary .gc{margin-left:auto;font-weight:600;color:var(--ink-3);text-transform:none;letter-spacing:0;flex:0 0 auto}
.more{display:block;width:100%;margin:4px 0 2px;padding:6px;border:1px dashed var(--line);border-radius:8px;background:transparent;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.dfoot{padding:8px 14px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lnk{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:12.5px;font-weight:500}

/* question item */
.q{border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--surface);min-width:0}
.q.new{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.q .qr{display:flex;gap:8px;padding:8px 10px;align-items:flex-start;cursor:pointer;min-width:0}
.q .qm{min-width:0;flex:1}
.q .qt{font-size:13px;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q.open-x .qt{-webkit-line-clamp:unset;display:block}
.q .qx{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:5px;align-items:center;font-size:11.5px;color:var(--ink-3);min-width:0}
.tag{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag.client_question{background:var(--accent-bg);color:var(--accent)}
.tag.assumption{background:var(--sunk);color:var(--ink-2)}
.tag.trade_off{background:var(--critique-bg);color:var(--critique)}
.tag.s-new{background:var(--bad);color:#fff}
.tag.s-awaiting{background:var(--warn-bg);color:var(--warn)}
.tag.s-found{background:var(--consol-bg);color:var(--consol)}
.tag.s-closed{background:var(--passed-bg);color:var(--passed)}
.q .qside{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.kbtn{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap}
.kbtn:hover{border-color:var(--passed);color:var(--passed)}
.q .qb2{padding:0 10px 10px;font-size:13px;border-top:1px solid var(--line-2)}
.q .qb2 p{margin:8px 0;overflow-wrap:anywhere}
.q .qb2 .k{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);display:block;margin-bottom:1px}
.proc{background:var(--surface-2);border-radius:8px;padding:7px 9px;margin:8px 0;overflow-wrap:anywhere}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-bg)}
.opt .rd{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;margin-top:1px}
.opt[aria-checked="true"] .rd{border:5px solid var(--accent)}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt .oc{font-size:12px;color:var(--ink-3)}
.rec{display:inline-block;font-size:10.5px;font-weight:700;color:var(--passed);background:var(--passed-bg);border-radius:8px;padding:0 6px;margin-left:4px;vertical-align:1px}
textarea{width:100%;min-height:60px;resize:vertical;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.good{background:transparent;color:var(--passed);border-color:var(--passed)}
.note{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}

/* ---------- side drawer (scope story / report) */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,94vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:40;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s ease}
.drawer.on{transform:none}
.drh{padding:14px 18px 10px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:flex-start}
.drh .tt{flex:1;min-width:0}
.drh h2{margin:0;font-size:19px;overflow-wrap:anywhere}
.drh .sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--ink-3)}
.stage{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:700;color:#fff;background:var(--c);white-space:nowrap}
.drb{flex:1;overflow-y:auto;padding:4px 18px 30px}
.sec{margin-top:16px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.sec h3 .c{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.story{font-size:14px;background:var(--surface-2);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
.arow{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line-2);min-width:0}
.arow:first-child{border-top:0}
.arow .m{min-width:0;flex:1}

/* demo mode: a recorded fictional run played in the browser */
.demo{position:relative;flex:0 0 auto;height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 3px 0 10px;border-radius:13px;border:1px dashed var(--gate);background:var(--gate-bg);color:var(--gate);font-size:12px;font-weight:700;white-space:nowrap}
.demo .dm{height:20px;padding:0 8px;border-radius:10px;border:1px solid color-mix(in srgb,var(--gate) 45%,transparent);background:var(--surface);color:var(--gate);font-size:11.5px;font-weight:700;cursor:pointer}
.demo .dm:disabled{opacity:.55;cursor:default}
.dmenu{position:absolute;top:30px;right:0;z-index:50;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;display:flex;flex-direction:column}
.dmenu[hidden]{display:none}
.dmenu .dmh{font-size:11px;font-weight:600;color:var(--ink-3);padding:4px 8px 6px;white-space:normal}
.dmenu button{border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer}
.dmenu button:hover{background:var(--surface-2)}
.dmenu button.past{color:var(--ink-3)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="t" id="title">Run board</div><div class="s" id="subtitle">connecting</div></div>
  <div class="live" id="live"><i></i><span id="liveTxt">connecting</span></div>
  <div class="sep"></div>
  <button class="tb" id="btnAgents" aria-expanded="false" title="Every agent the run has started and not yet delivered"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 14c.6-2.6 2.3-4 4.5-4s3.9 1.4 4.5 4"/><circle cx="11.5" cy="5" r="2"/><path d="M12 9.3c1.5.3 2.3 1.4 2.6 3.2"/></svg><span id="agentsTxt">Agents</span></button>
  <button class="tb" id="btnDec" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg><span class="lb">Decisions</span><span id="decN"></span></button>
  <button class="tb" id="btnReport" title="Progress report, knowledge base and the run log"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 1.8h5.5L12.5 5v9.2H4z"/><path d="M6 8h4.5M6 10.5h4.5"/></svg><span class="lb">Report</span></button>
  <div class="sep"></div>
  <button class="tb" id="btnPause" title="Graceful pause: no new agents start, running ones finish their step, state is saved"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="2.6" height="10" rx="1"/><rect x="9.4" y="3" width="2.6" height="10" rx="1"/></svg><span id="pauseTxt">Pause</span></button>
  <button class="tb" id="btnCk" title="Ask for a fresh progress report and interim workbooks"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5l3 3 7-7"/></svg><span id="ckTxt">Checkpoint</span></button>
  <div class="sep"></div>
  <button class="tb" id="btnTheme" title="Switch between light and dark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.2"/><path d="M8 2.8v10.4" /><path d="M8 2.8a5.2 5.2 0 0 1 0 10.4z" fill="currentColor"/></svg><span class="lb" id="themeTxt">Theme</span></button>
</header>
<div class="banner" id="banner" hidden></div>
<section class="dest" id="dest" aria-label="Deliverables"></section>
<main class="wrap">
  <div class="boardwrap">
    <div class="lanes" id="lanes"></div>
    <section class="psec" id="panels" aria-label="Method views"></section>
    <section class="gsec" id="gate" aria-label="Final gate"></section>
  </div>
  <aside class="decisions" id="dec" hidden aria-label="Questions and decisions"></aside>
</main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
// Data: GET /api/state (progress rows with stage/feeds/partial, agents, deliverables, questions, gate, knowledge, narrative, control, inbox),
// GET /api/scope?name= (claims below threshold with the critics' reasons, hints). Writes: POST /api/answer (answer | keep | reopen),
// /api/inbox (analyst_hint, critic_fact, critic_hint, knowledge, gate_question_feedback, panel_edit), /api/command (pause, resume, checkpoint). Nothing here is simulated, except in demo mode (DEMO).
// A method's panels (state.panels, e.g. tech-fit-estimation's "Impact per system") render below the lanes; a cell edit is optional and goes to the inbox.
const params = new URLSearchParams(location.search), TOKEN = params.get('t') || '';
// Demo mode (onboarding): dashboard.html?demo=1 (or #demo) opened from file:// plays the recorded fictional run in demo/ instead of asking a
// server; &scenario=<name> plays demo/recording-<name>.js (e.g. estimate: a tech-fit-estimation run of several systems), without it the
// code analysis demo/recording.js. A served run never plays it: the server serves this page over http, where the parameter is ignored, and serves nothing from demo/.
const DEMO = location.protocol === 'file:' && (params.has('demo') || location.hash === '#demo');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const MEM = new Map();   // demo: drafts and read marks live in memory only, every opening starts fresh
const LS = DEMO ? { get: (k, d) => MEM.has(k) ? JSON.parse(MEM.get(k)) : d, set: (k, v) => MEM.set(k, JSON.stringify(v)), del: k => MEM.delete(k) } : { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
// The one seam to the data: every read and write of the page goes through `api`, nothing else calls fetch(). Demo mode replaces this
// object with the player (demo/player.js), which answers from the recording (demo/recording.js) in the same shapes.
const api = DEMO ? demoApi() : (() => {
  const call = (p, opt = {}) => fetch(p, Object.assign({ headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' } }, opt)).then(r => r.json());
  return {
    state: () => call('/api/state'),
    scope: name => call('/api/scope?name=' + encodeURIComponent(name)),
    post: (path, body) => call(path, { method: 'POST', body: JSON.stringify(Object.assign({ client_id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()) }, body)) })
  };
})();
function demoApi() {
  const load = src => new Promise((ok, no) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = () => no(new Error(src)); document.head.appendChild(el); });
  const sc = params.get('scenario') || '', rec = /^[a-z0-9-]+$/.test(sc) ? `demo/recording-${sc}.js` : 'demo/recording.js';   // a name only, never a path
  const p = load(rec).then(() => load('demo/player.js')).then(() => { const d = window.DBCX_DEMO_PLAYER(window.DBCX_DEMO, () => refresh(), seen); d.mount($('#live')); return d; });
  p.catch(e => { const b = $('#banner'); b.hidden = false; b.className = 'banner bad'; b.textContent = `Demo mode: ${e.message} could not be loaded; it belongs next to dashboard.html.`; });
  return { state: () => p.then(d => d.state()), scope: n => p.then(d => d.scope(n)), post: (path, body) => p.then(d => d.post(path, body)) };
}
const tms = iso => iso ? new Date(iso).getTime() : null;
const dur = ms => { const s = Math.max(0, Math.round(ms / 1000)); if (s < 60) return s + ' s'; const m = Math.round(s / 60); if (m < 60) return m + ' min'; const h = Math.floor(m / 60); return h < 48 ? h + ' h ' + (m % 60) + ' min' : Math.round(h / 24) + ' d'; };
const ago = iso => iso ? dur(Date.now() - tms(iso)) : '';
const fmt = iso => iso ? String(iso).replace('T', ' ').slice(0, 16) : '';
const nice = s => String(s || '').replace(/[-_]/g, ' ');
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3200); }
const typing = el => !!el && el.contains(document.activeElement) && /TEXTAREA|INPUT/.test(document.activeElement.tagName);

// theme: ?theme= wins, then the reader's own choice (the top bar button), else the system setting
const themeNow = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const themeSet = t => { document.documentElement.dataset.theme = t; $('#themeTxt').textContent = t === 'dark' ? 'Light' : 'Dark'; };
const theme0 = params.get('theme') || LS.get('dbcx.theme', null); if (theme0) document.documentElement.dataset.theme = theme0;
$('#themeTxt').textContent = themeNow() === 'dark' ? 'Light' : 'Dark';
$('#btnTheme').addEventListener('click', () => { const t = themeNow() === 'dark' ? 'light' : 'dark'; themeSet(t); LS.set('dbcx.theme', t); });
let S = null, lastOk = 0, failed = false;
const ui = { dec: false, filter: 'needs', kind: 'all', scopeF: null, openQ: new Set(), more: new Set(), closedGroups: new Set(LS.get('dbcx.closedGroups', [])), drawer: null, tab: 'report', form: null, scopeData: null, lanes: LS.get('dbcx.lanes', {}), glanes: LS.get('dbcx.glanes', {}), hy: new Set() };
const seen = LS.get('dbcx.seen', {});
let weightDefault = LS.get('dbcx.weight', 'proposal');

// ---------------------------------------------------------------- vocabulary
const TH = () => (S && S.pass_threshold) || 8;
const STAGES = () => [
  { id: 'queued', nm: 'Queued', ex: 'not started yet', c: 'var(--queued)' },
  { id: 'analysing', nm: 'Analysing', ex: 'analyst writes evidenced claims', c: 'var(--analysing)' },
  { id: 'critique', nm: 'In critique', ex: `critics score every claim, pass at ${TH()}`, c: 'var(--critique)' },
  { id: 'passed', nm: 'Passed', ex: `every claim at ${TH()} or above`, c: 'var(--passed)' },
  { id: 'consolidated', nm: 'Consolidated', ex: 'merged into its deliverable', c: 'var(--consol)' }
];
const SC = { queued: 'var(--queued)', analysing: 'var(--analysing)', critique: 'var(--critique)', passed: 'var(--passed)', consolidated: 'var(--consol)' };
const ROLE = {
  analyst: { l: 'A', nm: 'Analyst', rc: 'var(--r-analyst)' }, inventory: { l: 'A', nm: 'Inventory analyst', rc: 'var(--r-analyst)' },
  'critic-client': { l: 'C', nm: 'Critic · client evidence', rc: 'var(--r-client)' }, 'critic-standard': { l: 'S', nm: 'Critic · standard', rc: 'var(--r-standard)' },
  consolidator: { l: 'K', nm: 'Consolidator', rc: 'var(--r-consol)' }, gate: { l: 'G', nm: 'Gate reviewer', rc: 'var(--r-gate)' }, verifier: { l: 'V', nm: 'Gate verifier', rc: 'var(--r-gate)' },
  editor: { l: 'E', nm: 'Deliverable editor', rc: 'var(--r-gate)' }, postpass: { l: 'P', nm: 'Post-pass corrector', rc: 'var(--r-analyst)' }, progress: { l: 'R', nm: 'Progress reporter', rc: 'var(--queued)' }, researcher: { l: 'R', nm: 'Researcher', rc: 'var(--queued)' }
};
const role = r => ROLE[r] || { l: '?', nm: nice(r || 'agent'), rc: 'var(--queued)' };
const criticName = c => c === 'client' ? 'client evidence' : c.startsWith('standard-') ? 'standard ' + c.slice(9) : c === 'standard' ? 'standard' : nice(c);
const criticRole = c => c === 'client' ? 'critic-client' : 'critic-standard';
const KIND = { client_question: 'Client question', assumption: 'Assumption', trade_off: 'Trade-off', scope_question: 'Scope question', ruling: 'Ruling' };
const KINDS = [['all', 'All kinds'], ['client_question', 'Client questions'], ['assumption', 'Assumptions'], ['trade_off', 'Trade-offs'], ['scope_question', 'Scope questions'], ['rulings', 'Rulings']];
const PN = { cto: 'CTO', head_of_it: 'Head of IT', head_of_ecommerce: 'Head of eCommerce', head_of_marketing: 'Head of Marketing', product_owner: 'Product owner' };
const pname = p => PN[p] || nice(p).replace(/^./, c => c.toUpperCase());

// ---------------------------------------------------------------- derived state
const rows = () => (S && S.analysts) || [];
const row = id => rows().find(a => a.scope === id);
const agents = () => (S && S.agents) || [];
const agentsOn = id => agents().filter(a => a.scope === id);
const isFinal = a => !!a && ['final', 'passed', 'passed-rework-ordered'].includes(a.state);
const done = a => a.stage === 'passed' || a.stage === 'consolidated' || a.failed;
// Question state, one of: awaiting (your answer / keep / reopen is in the inbox), found (the run answered it itself), needs (open, yours), closed
const qs = () => (S && S.questions) || [];
const foundAnswer = q => !!(q.answer && (q.answer.by || 'lead') !== 'lead' && !q.pending);
const qState = q => q.pending ? 'awaiting' : q.status === 'closed' ? 'closed' : foundAnswer(q) ? 'found' : q.status === 'open' ? 'needs' : 'closed';
const kept = q => q.status === 'closed' && q.resolution === 'assumption_kept';
const needs = q => qState(q) === 'needs';
const unread = q => needs(q) && seen[q.id] !== q.updated_at;
const settled = q => { const af = q.affects || []; return af.length > 0 && af.every(x => isFinal(row(x))); };
const markSeen = q => { if (seen[q.id] === q.updated_at) return false; seen[q.id] = q.updated_at; LS.set('dbcx.seen', seen); return true; };
const groupOf = q => row(q.from) ? q.from : q.kind === 'ruling' ? '_rulings' : '_run';
const groupName = k => k === '_run' ? 'Whole run' : k === '_rulings' ? 'Rulings' : k;
const optOf = (q, k) => (q.options || []).find(o => o.key === k);

// ---------------------------------------------------------------- top bar + banner
function renderTop() {
  const s = S, c = s.control || {}, ag = agents();
  $('#title').textContent = s.client || s.run; document.title = `${s.client || s.run} · run board`;
  const rt = s.runtime || {};
  $('#subtitle').textContent = `${nice(s.method)} · run ${s.run} · ${rt.model || '?'} (${rt.reasoning_effort || '?'}) · pass mark ${s.pass_threshold}`;
  $('#subtitle').title = $('#subtitle').textContent + ` · state computed ${fmt(s.computed_at)}`;
  const nst = ag.filter(a => a.stalled).length;
  $('#agentsTxt').innerHTML = ag.length ? `${ag.length - nst} working${nst ? ` <span class="n new">${nst} stalled</span>` : ''}` : 'No agent working';
  const nw = qs().filter(unread).length, nd = qs().filter(needs).length;
  $('#decN').innerHTML = `<span class="n ${nw ? 'new' : ''}" title="${nd} need you, ${nw} of them new">${nw ? nw + ' new' : nd}</span>`;
  $('#btnDec').setAttribute('aria-pressed', ui.dec);
  const p = c.pause_requested ? (c.pause_ack_at ? 'paused' : 'pausing') : 'running';
  $('#pauseTxt').textContent = p === 'running' ? 'Pause' : 'Resume';
  $('#btnPause').classList.toggle('ctl-warn', p !== 'running');
  $('#btnPause').title = p === 'running' ? 'Graceful pause: no new agents start, running ones finish their step, state is saved' : 'Resume: new agents may start again';
  $('#btnCk').disabled = !!c.checkpoint_requested_at; $('#ckTxt').textContent = c.checkpoint_requested_at ? 'Checkpoint…' : 'Checkpoint';
  $('#btnCk').title = c.checkpoint_requested_at ? `Checkpoint requested ${fmt(c.checkpoint_requested_at)}; the orchestrator writes the report and interim workbooks at its next step` : 'Ask for a fresh progress report and interim workbooks' + (c.checkpoint_done_at ? ` (last one ${fmt(c.checkpoint_done_at)})` : '');
  $('#live').classList.toggle('paused', p !== 'running'); $('#live').dataset.p = p;
  const b = $('#banner'), err = s.error || s.board_error;
  if (err) { b.hidden = false; b.className = 'banner bad'; b.textContent = 'Part of the progress could not be computed: ' + err; }
  else if (p === 'running') b.hidden = true;
  else { b.hidden = false; b.className = 'banner'; b.innerHTML = p === 'pausing' ? `<b>Pause requested</b> at ${esc(fmt(c.pause_requested_at))}. No new agents start${ag.length ? `; the ${ag.length} running agent${ag.length > 1 ? 's finish their' : ' finishes its'} current step` : ''}. The orchestrator confirms at its next step.` : `<b>Paused</b> since ${esc(fmt(c.pause_ack_at))}. No new agents start; state is saved. ${ag.length ? ag.length + ' agent' + (ag.length > 1 ? 's are' : ' is') + ' still finishing. Wait for them, then close the session.' : 'Safe to close the session. Resume continues where the run stopped.'}`; }
  liveTick();
}
function liveTick() {
  const lv = $('#live'), t = $('#liveTxt'); if (!lastOk) return;
  const s = (Date.now() - lastOk) / 1000;
  lv.classList.toggle('off', failed); lv.classList.toggle('stale', !failed && s > 25);
  t.textContent = failed ? 'Server unreachable · showing the last state' : `${lv.dataset.p === 'paused' ? 'Paused' : lv.dataset.p === 'pausing' ? 'Pausing' : DEMO ? 'Replay' : 'Live'} · ${Math.round(s)} s ago`;
}

// ---------------------------------------------------------------- deliverables strip
function renderDest() {
  const D = S.deliverables || [], g = (S.per_deliverable_pct || {}).final_gate;
  const units = rows().filter(a => a.group === 'scope');
  let h = `<div class="dcard overall" title="${esc((S.formulas || {}).overall || '')}"><div class="pc">${S.overall_pct}%</div><div class="ln">overall · ${units.filter(done).length} of ${units.length} scopes final</div></div>`;
  D.forEach(d => {
    const sc = d.scopes.map(row).filter(Boolean), cs = d.consolidations.map(row).filter(Boolean);
    const segs = sc.map(a => `<i class="${a.failed ? 'failed' : a.stage === 'queued' ? '' : a.stage}" title="${esc(a.scope)}: ${esc(a.stage)}"></i>`).join('') + cs.map(c => `<i class="cons ${c.stage === 'queued' ? '' : c.stage}" title="${esc(c.scope)} (consolidation): ${esc(c.stage)}"></i>`).join('');
    const f = sc.filter(done).length, cd = cs.filter(c => c.stage === 'consolidated').length;
    const line = sc.length === 1 && !cs.length ? `${sc[0].scope} ${sc[0].stage}${d.built ? ' · workbook built' : ''}` : `${sc.length ? `${f} of ${sc.length} final` : 'no scope feeds it'}${cs.length ? ` · ${cd ? cd + ' of ' + cs.length + ' consolidated' : 'consolidation waits'}` : ''}${d.built ? ' · workbook built' : ''}`;
    h += `<div class="dcard" title="${esc(d.id)} ${esc(d.name)}: ${esc(d.formula)}"><div class="h"><span class="nm">${esc(d.name)}</span><span class="pc">${d.pct}%</span></div><div class="segs ${segs ? '' : 'none'}">${segs}</div><div class="ln">${esc(line)}</div></div>`;
  });
  if (g != null) { const r = gateLast(), gs0 = G(); h += `<div class="dcard gatec" role="button" tabindex="0" data-act="open-gate" style="cursor:pointer" title="${esc((S.formulas || {}).final_gate || '')} · click to go to the final gate"><div class="h"><span class="nm">Final gate</span><span class="pc">${g}%</span></div><div class="segs">${gs0.rounds.length ? Array.from({ length: gs0.max_rounds || gs0.rounds.length }, (_, i) => i + 1).map(k => { const x = gs0.rounds.find(y => y.round === k); return `<i class="${!x ? '' : x.done ? (x.result && x.result.passed ? 'passed' : 'failed') : 'grun'}" title="Round ${k}${!x ? ' · not reached' : x.done ? (x.result && x.result.passed ? ' · passed' : ' · not passed') : ' · running'}"></i>`; }).join('') : D.map(d => `<i class="${d.pct >= 100 ? 'consolidated' : ''}" title="${esc(d.name)}"></i>`).join('')}</div><div class="ln">${r ? `round ${r.round} · ${r.done ? (r.result.passed ? 'passed' : 'not passed') : 'being scored'}` : `${D.filter(d => d.pct >= 100).length} of ${D.length} deliverables ready`}</div></div>`; }
  const el = $('#dest'); el.style.gridTemplateColumns = `minmax(140px,.7fr) repeat(${D.length + (g != null ? 1 : 0)},minmax(0,1fr))`; el.innerHTML = h;
}

// ---------------------------------------------------------------- board
const cards = new Map();
function lanesOf() {
  const w = [...new Set(rows().map(a => a.wave))].sort((a, b) => a - b);
  return w.map(n => { const rs = rows().filter(a => a.wave === n), g = rs[0] && rs[0].group;
    const nm = rs.every(a => a.group === 'inventory') ? 'Inventory' : rs.every(a => a.group === 'consolidation') ? 'Consolidation' : `Wave ${n}`;
    const ex = nm === 'Inventory' ? 'the automated scan verified into the run inventory' : nm === 'Consolidation' ? 'merged into the deliverables once every wave is final' : `${rs.length} scope${rs.length > 1 ? 's' : ''}`;
    return { n, rows: rs, nm, ex, g }; });
}
// A lane that has not started (every card queued) or is finished (every card consolidated) collapses to one line, so the lanes still
// moving stay above the fold at 1280 x 800. The reader's own toggle wins and is remembered.
const laneOpen = L => ui.lanes[L.n] != null ? ui.lanes[L.n] : !(L.rows.every(a => a.stage === 'queued') || L.rows.every(a => a.stage === 'consolidated'));
function statusLine(a) {
  const on = agentsOn(a.scope), last = a.rounds[a.rounds.length - 1], since = on[0] ? ' · ' + ago(on[0].spawned_at) : '', st = on.find(x => x.stalled);
  if (st && (a.stage === 'analysing' || a.stage === 'critique')) return `<b>${a.stage === 'critique' ? 'A critic is' : 'The analyst is'} stalled</b> · silent ${silent(st)}`;
  if (a.failed) return `<b>Did not pass</b> after ${a.rounds.length} rounds${last ? ' · best ' + Math.min(...Object.values(last.scores).filter(v => typeof v === 'number')) : ''}`;
  if (a.stage === 'queued') return 'not started yet';
  if (a.stage === 'analysing') return a.state === 'passed-rework-ordered' ? `<b>Text correction</b> after the pass${since}` : a.rework ? `<b>Reworking</b> after round ${a.rounds.length}${since}` : `<b>Drafting</b> claims${since}`;
  if (a.stage === 'critique') return a.check === 'deterministic' ? '<b>Deterministic check</b> · no critic by design' : `<b>Critics scoring</b> round ${a.cur || a.rounds.length + 1}${since}`;
  if (a.stage === 'passed') return `<b>Passed</b>${a.rounds.length ? ' in round ' + a.rounds.length : ''}${a.claims ? ' · ' + a.claims + ' claims' : ''}`;
  if (a.stage === 'consolidated') return `<b>In the deliverable</b>${a.claims ? ' · ' + a.claims + ' claims' : ''}`;
  return esc(a.state);
}
function dots(a) {
  let h = ''; const n = Math.max(a.max_rounds || 0, a.rounds.length);
  for (let i = 0; i < n; i++) { const r = a.rounds[i]; h += `<i class="${r ? (r.passed ? 'p' : 'f') : (a.cur === i + 1 ? 'cur' : '')}"></i>`; }
  return h;
}
function barsHTML(a) {

  if (nd.status !== 'queued' && nd.status !== 'reviewing') h += `<div class="sec"><h3>Defects<span class="c">${esc(sevLine(nd.defects))}</span></h3>${(nd.defects || []).map(d => `<div class="icard ${esc(d.severity)}"><div class="ih"><span class="sev ${esc(d.severity)}">${esc(d.severity)}</span><b>${esc(d.id)}</b><span class="mono muted">${esc(d.where || '')}</span></div><div class="it">${esc(d.text)}</div></div>`).join('') || '<p class="note">None.</p>'}</div>`;
  return h + '</div>';
}
function fixplanDrawer(g, r) {
  const res = r.result || {}, C = r.fixplan ? r.fixplan.clusters || [] : [], name = id => id === 'hygiene' || id === 'verifier' ? gname(id) : gname(String(id).split(':')[0]);
  let h = gdh(`Fix plan · round ${r.round}`, `<span>${C.length} issue cluster${C.length === 1 ? '' : 's'}${r.round < g.current ? ', executed before round ' + (r.round + 1) : ''}</span>`) + '<div class="drb">';
  h += `<div class="sec"><h3>Pass rule</h3><div class="rule">${Object.entries(res.criteria || {}).map(([k, v]) => `<div class="${v ? '' : 'no'}">${v ? '✓' : '✗'} ${esc(critLabel(k))}</div>`).join('') || '<span class="muted">No result yet.</span>'}</div></div>`;
  h += `<div class="sec"><h3>Clusters</h3>${C.map(c => `<div class="icard ${esc(c.severity)}"><div class="ih"><span class="sev ${esc(c.severity)}">${esc(c.severity)}</span>${c.unchanged_since ? `<span class="life again" title="unchanged since round ${esc(c.unchanged_since)}">raised again</span>` : ''}${c.decision ? '<span class="life lead">decided by you</span>' : ''}<b>${esc(c.id)}</b><span class="muted">${esc((c.raised_by || []).map(name).join(', '))}${c.mechanism ? ' · ' + esc(c.mechanism) : ''}${(c.questions || []).length ? ' · ' + esc(c.questions.join(', ')) : ''}</span></div><div class="it">${esc(c.title)}</div>${c.proposed ? `<div class="ic"><b>Proposed:</b> ${esc(c.proposed)}</div>` : ''}${c.decision ? `<div class="dec">Your decision: ${esc(dtext(c.decision))}</div>` : ''}</div>`).join('') || '<p class="note">No clusters.</p>'}</div>`;
  return h + '</div>';
}
function gateDrawer(k) {
  const [, n, id] = k.split(':'), g = G(), r = g.rounds.find(x => String(x.round) === n), nd = r && r.nodes.find(x => x.id === id);
  if (r && id === 'fixplan') return fixplanDrawer(g, r);
  if (!nd) return gdh('Final gate', '') + '<div class="drb"><p class="muted">This round is no longer on the board.</p></div>';
  return nd.kind === 'persona' ? personaDrawer(g, r, nd) : nd.kind === 'hygiene' ? hygieneDrawer(g, r, nd) : verifierDrawer(g, r, nd);
}
function md(t) { return t.split(/\n{2,}/).map(b => b.trim().startsWith('|') ? `<pre>${esc(b)}</pre>` : /^#{1,3} /.test(b) ? `<h2>${esc(b.replace(/^#{1,3} /, '').split('\n')[0])}</h2>${b.split('\n').length > 1 ? md(b.split('\n').slice(1).join('\n')) : ''}` : b.trim().startsWith('- ') ? `<ul>${b.split('\n').map(l => `<li>${esc(l.replace(/^\s*- /, ''))}</li>`).join('')}</ul>` : `<p>${esc(b)}</p>`).join(''); }
function reportDrawer() {
  const n = S.narrative || {}, k = S.knowledge || {}, T = k.topics || [], tab = ui.tab;
  let h = `<div class="drh"><div class="tt"><h2>${tab === 'report' ? 'Progress report' : tab === 'kb' ? 'Knowledge base' : 'Run log'}</h2><div class="tabs" role="tablist">${[['report', 'Report'], ['kb', `Knowledge (${k.total || 0})`], ['log', 'Run log']].map(([id, l]) => `<button role="tab" data-act="tab" data-tab="${id}" aria-selected="${tab === id}">${l}</button>`).join('')}</div></div><button class="x" data-act="close">×</button></div><div class="drb">`;
  if (tab === 'report') {
    const stale = n.as_of && Date.now() - tms(n.as_of) > 6 * 3600e3;
    h += `<div class="sec"><div class="note">Written by the progress reporter on request · ${n.as_of ? 'as of ' + esc(fmt(n.as_of)) + ' (' + esc(ago(n.as_of)) + ' ago)' : 'not written yet'}${stale ? ' · <span class="tag s-upd">older than the board</span>' : ''} · <button class="lnk" data-act="ck">Ask for a fresh one (checkpoint)</button></div></div><div class="md">${n.md ? md(n.md) : '<p class="muted">No narrative report yet. A checkpoint asks the orchestrator for one.</p>'}</div>`;
  } else if (tab === 'kb') {
    const ent = e => `<div class="kbe"><div class="kbm"><b>${esc(e.id)}</b> · ${esc(e.type)} · ${esc(e.by || '')} · ${esc(e.weight)} · applies to ${(e.applies_to || []).includes('*') ? 'every scope' : esc((e.applies_to || []).join(', '))}${e.core ? ' · <span class="vd">core</span>' : ''} · source ${esc([e.source.kind, e.source.ref].filter(Boolean).join(' '))}</div><div class="kbx">${esc(e.text)}</div></div>`;
    h += `<div class="sec"><h3>Add knowledge<span class="c">becomes a candidate the orchestrator promotes or rejects</span></h3><div class="form kbform"><textarea id="kbtext" placeholder="Knowledge that matters to more than one scope: a fact, a decision, a working assumption. The orchestrator words it as one statement and decides where it applies.">${esc(LS.get('dbcx.kbdraft', ''))}</textarea><input id="kbscopes" placeholder="scopes, comma-separated (optional)"><div class="acts"><button class="btn" id="kbsend" data-act="kbsend">Send to the knowledge base</button></div></div></div>
      <div class="sec"><h3>Entries<span class="c">${k.total || 0} active · ${T.length} topic${T.length === 1 ? '' : 's'}${k.candidates_open ? ' · ' + k.candidates_open + ' open candidate(s)' : ''}</span></h3>${k.error ? `<p class="err">${esc(k.error)}</p>` : ''}${T.length ? T.map(t => `<details class="kbt" data-kb="${esc(t.name)}" ${ui.kbOpen && ui.kbOpen.has(t.name) ? 'open' : ''}><summary>${esc(t.name)}${t.summary ? ' — ' + esc(t.summary) : ''} (${t.active}${t.superseded ? `, ${t.superseded} superseded` : ''})</summary>${t.entries.map(ent).join('')}</details>`).join('') : '<p class="muted">No knowledge-base entries yet.</p>'}</div>`;
  } else {
    const ib = S.inbox || { total: 0, unprocessed: 0, recent: [] }, rt = S.runtime || {};
    h += `<div class="sec"><h3>Last steps of the orchestrator</h3>${(S.history || []).length ? `<ul class="log">${S.history.slice().reverse().map(x => `<li><span class="t">${esc((x.t || '').slice(5, 16))}</span>${esc(x.msg)}</li>`).join('')}</ul>` : '<p class="muted">No history yet.</p>'}</div>
      <div class="sec"><h3>Inbox<span class="c">${ib.unprocessed} waiting · ${ib.total} total</span></h3>${(ib.recent || []).length ? `<ul class="log">${ib.recent.slice().reverse().map(e => `<li><span class="t">${esc(fmt(e.at).slice(5))}</span>${esc(nice(e.kind))}${e.command ? ' ' + esc(e.command) : ''}${e.id ? ' ' + esc(e.id) : ''}${e.scope ? ' ' + esc(e.scope) : ''}${e.claim_id ? ' ' + esc(e.claim_id) : ''} · ${e.processed ? 'applied' + (e.outcome ? ': ' + esc(e.outcome) : '') : '<b>waiting for the orchestrator</b>'}</li>`).join('')}</ul>` : '<p class="muted">Nothing sent yet.</p>'}</div>
      <div class="sec"><h3>Assumptions logged by the orchestrator<span class="c">${(S.assumptions || []).length} recent</span></h3>${(S.assumptions || []).length ? `<ul class="log">${S.assumptions.slice().reverse().map(x => `<li><span class="t">${esc(x.t || '')}</span>${esc(x.text || '')}</li>`).join('')}</ul>` : '<p class="muted">None.</p>'}</div>
      <div class="sec"><h3>Agents in flight</h3>${agentRows(agents())}</div>
      <div class="sec"><h3>Run</h3><p class="note">${esc(S.server.run_dir || '')}<br>${esc(rt.harness || '?')} / ${esc(rt.provider || '?')} · ${esc(rt.model || '?')} (${esc(rt.reasoning_effort || '?')}) · state computed ${esc(fmt(S.computed_at))} · server time ${esc(fmt(S.server.time))}. Every percentage shows its formula on hover.</p></div>`;
  }
  return h + '</div>';
}
function renderDrawer(force) {
  const dr = $('#drawer'); if (!ui.drawer || !S) return;
  if (!force && drawerBusy()) return;
  const keep = dr.querySelector('.drb') ? dr.querySelector('.drb').scrollTop : 0, a = row(ui.drawer);
  dr.innerHTML = ui.drawer === '_report' ? reportDrawer() : /^_g:/.test(ui.drawer) ? gateDrawer(ui.drawer) : a ? scopeDrawer(a) : `<div class="drh"><div class="tt"><h2>${esc(ui.drawer)}</h2></div><button class="x" data-act="close">×</button></div><div class="drb"><p class="muted">This scope is no longer on the board.</p></div>`;
  if (dr.querySelector('.drb')) dr.querySelector('.drb').scrollTop = keep;
}

// ---------------------------------------------------------------- agents popover
function renderPop() {
  const p = $('#pop'); if (p.hidden) return;
  const r = $('#btnAgents').getBoundingClientRect(); p.style.left = Math.max(12, Math.min(r.left, innerWidth - p.offsetWidth - 12)) + 'px';
  const ag = agents();
  p.innerHTML = (ag.length ? ag.map(a => `<div class="arow ${a.stalled ? 'stalled' : ''}" ${a.scope && a.scope !== '_gate' ? `data-act="open-scope" data-scope="${esc(a.scope)}"` : a.scope === '_gate' ? 'data-act="open-gate"' : ''}>${avHTML(a)}<div class="m"><div class="w">${esc(role(a.role).nm)} · ${esc(a.scope === '_gate' ? 'final gate' : a.scope || a.agent)}</div><div class="d">${a.round ? 'round ' + esc(a.round) + ' · ' : ''}running for ${esc(ago(a.spawned_at))} · ${esc(life(a))}</div><ul><li>${esc(a.agent)} · ${esc(a.model || '')}</li></ul></div></div>`).join('') : '<p class="muted">No agent is working.</p>')
    + `<div class="legend">${[['analyst'], ['critic-client'], ['critic-standard'], ['consolidator'], ['gate']].map(([k]) => `<span><span class="av" style="--rc:${role(k).rc}">${role(k).l}</span>${esc(role(k).nm)}</span>`).join('')}</div>`;
}

// ---------------------------------------------------------------- actions
function everything() { if (!S) return; renderTop(); renderDest(); renderBoard(); renderDec(); renderDrawer(); renderPop(); }
const qById = id => qs().find(q => q.id === id);
async function sendAnswer(q) {
  const d = draftOf(q); if (!d.option || (d.option === 'other' && !d.text.trim())) return;
  const body = { id: q.id, option: d.option === 'other' ? '' : d.option, text: d.text.trim(), weight: q.kind === 'ruling' ? 'fact' : d.weight };
  try { const r = await api.post('/api/answer', body); if (r.ok) { LS.del('dbcx.draft.' + q.id); toast(`${q.id}: answer sent as ${body.weight} – the orchestrator applies it at its next step`); refresh(true); } else showQErr(q, r.error || 'failed'); }
  catch { showQErr(q, 'server unreachable, the draft is kept'); }
}
const showQErr = (q, t) => document.querySelectorAll(`.q[data-qid="${CSS.escape(q.id)}"] .qerr`).forEach(e => { e.innerHTML = `<span class="err">${esc(t)}</span>`; });
async function keepOrReopen(q, kind) {
  try { const r = await api.post('/api/answer', { kind, id: q.id }); if (r.ok) { ui.openQ.delete(q.id); toast(kind === 'keep' ? `${q.id}: assumption kept – nothing is re-analysed. Reopen any time.` : `${q.id}: reopen sent`); refresh(true); } else toast(`${q.id}: ${r.error || 'failed'}`); }
  catch { toast('Server unreachable'); }
}
async function command(cmd, label) { try { const r = await api.post('/api/command', { command: cmd }); toast(r.ok ? label : r.error || 'failed'); } catch { toast('Server unreachable'); } refresh(true); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) { if (!$('#pop').hidden && !e.target.closest('#pop,#btnAgents')) { $('#pop').hidden = true; $('#btnAgents').setAttribute('aria-expanded', 'false'); } return; }
  const a = t.dataset.act, q = t.dataset.q ? qById(t.dataset.q) : null;
  if (a === 'scope-q') { e.stopPropagation(); ui.dec = true; ui.scopeF = t.dataset.scope; ui.filter = 'needs'; ui.closedGroups.delete(t.dataset.scope); layout(); renderDec(true); renderTop(); return; }
  if (a === 'open-scope') { $('#pop').hidden = true; openDrawer(t.dataset.scope); return; }
  if (a === 'open-gate') { $('#pop').hidden = true; if (ui.drawer) closeDrawer(); gotoGate(); return; }
  if (a === 'gopen') { $('#pop').hidden = true; openDrawer(`_g:${t.dataset.n}:${t.dataset.id}`); return; }
  if (a === 'gfix') { openDrawer(`_g:${t.dataset.n}:fixplan`); return; }
  if (a === 'glane') { const g = G(), r = g.rounds.find(x => String(x.round) === t.dataset.n); ui.glanes[r.round] = !glaneOpen(g, r); LS.set('dbcx.glanes', ui.glanes); renderGate(); return; }
  if (a === 'hy-toggle') { const k = t.dataset.k; ui.hy.has(k) ? ui.hy.delete(k) : ui.hy.add(k); renderDrawer(true); return; }
  if (a === 'gfb') { ui.form = ui.form === 'gq:' + t.dataset.k ? null : 'gq:' + t.dataset.k; renderDrawer(true); const ta = $(`#drawer textarea[data-gfb="${CSS.escape(t.dataset.k)}"]`); if (ta) ta.focus(); return; }
  if (a === 'gfb-i') { const d = gfbDraft(t.dataset.k); d.intent = t.value; LS.set('dbcx.gfb.' + t.dataset.k, d); return; }
  if (a === 'gfb-cancel') { ui.form = null; renderDrawer(true); return; }
  if (a === 'gfb-send') {
    const k = t.dataset.k, d = gfbDraft(k), ta = $(`#drawer textarea[data-gfb="${CSS.escape(k)}"]`), text = (ta ? ta.value : d.text).trim(); if (!text) { if (ta) ta.focus(); return; }
    const body = { kind: 'gate_question_feedback', persona: t.dataset.p, question_id: t.dataset.q, round: +t.dataset.n, intent: d.intent, text };
    api.post('/api/inbox', body).then(r => { if (r.ok) { LS.del('dbcx.gfb.' + k); ui.form = null; toast('Feedback is in the inbox; the orchestrator reacts at its next step, with its own wording or a reason'); renderDrawer(true); refresh(true); } else toast(r.error || 'failed'); }).catch(() => toast('Server unreachable, the draft is kept'));
    return;
  }
  if (a === 'pcell') { const k = pkey(t.dataset.p, t.dataset.r, t.dataset.c); ui.pcell = ui.pcell === k ? null : k; $('#panels')._h = null; renderPanels(); const ta = $('#pedit textarea'); if (ta) ta.focus(); return; }
  if (a === 'pclose') { ui.pcell = null; $('#panels')._h = null; renderPanels(); return; }
  if (a === 'pfilter') { ui.pfilter = Object.assign({}, ui.pfilter, { [t.dataset.p]: t.dataset.c }); renderPanels(); return; }
  if (a === 'psend') { sendPanelEdit(t); return; }
  if (a === 'lane') { const L = lanesOf().find(l => String(l.n) === t.dataset.lane); ui.lanes[L.n] = !laneOpen(L); LS.set('dbcx.lanes', ui.lanes); renderBoard(); return; }
  if (a === 'close') return closeDrawer();
  if (a === 'tab') { ui.tab = t.dataset.tab; renderDrawer(true); return; }
  if (a === 'dec-close') { ui.dec = false; layout(); renderDec(); renderTop(); return; }
  if (a === 'q-toggle') { if (e.target.closest('button,.opt,textarea,.seg,input,label')) return; if (ui.openQ.has(q.id)) ui.openQ.delete(q.id); else { ui.openQ.add(q.id); markSeen(q); } renderDec(true); renderDrawer(true); renderBoard(); renderTop(); return; }
  if (a === 'q-goto') { const x = qById(t.dataset.q); if (!x) { toast(`${t.dataset.q} is not on this dashboard`); return; } ui.dec = true; ui.filter = 'all'; ui.kind = 'all'; ui.scopeF = null; ui.openQ.add(x.id); ui.closedGroups.delete(groupOf(x)); ui.more.add(groupOf(x)); layout(); renderDec(true); renderTop(); const el = $(`#dec .q[data-qid="${CSS.escape(x.id)}"]`); if (el) el.scrollIntoView({ block: 'center' }); return; }
  if (a === 'q-keep') { keepOrReopen(q, 'keep'); return; }
  if (a === 'q-reopen') { keepOrReopen(q, 'reopen'); return; }
  if (a === 'q-opt') { const d = draftOf(q); d.option = t.value; saveDraft(q, d); renderDec(true); renderDrawer(true); return; }
  if (a === 'q-w') { const d = draftOf(q); d.weight = t.dataset.w; weightDefault = d.weight; LS.set('dbcx.weight', weightDefault); saveDraft(q, d); renderDec(true); renderDrawer(true); return; }
  if (a === 'q-discard') { LS.del('dbcx.draft.' + q.id); renderDec(true); renderDrawer(true); return; }
  if (a === 'q-send') { t.disabled = true; t.textContent = 'Sending'; sendAnswer(q); return; }
  if (a === 'f') { ui.filter = t.dataset.f; renderDec(true); return; }
  if (a === 'k') { ui.kind = t.dataset.k; renderDec(true); return; }
  if (a === 'scopef-clear') { ui.scopeF = null; renderDec(true); return; }
  if (a === 'more') { ui.more.add(t.dataset.g); renderDec(true); return; }
  if (a === 'read-all') { qs().forEach(markSeen); everything(); return; }
  if (a === 'form') { ui.form = t.dataset.f; renderDrawer(true); const ta = $(`#drawer textarea[data-hdraft="${CSS.escape(ui.form)}"]`); if (ta) ta.focus(); return; }
  if (a === 'form-cancel') { LS.del(t.dataset.f); ui.form = null; renderDrawer(true); return; }
  if (a === 'dmode') { const d = hintDraft(t.dataset.f); d.mode = t.dataset.m; LS.set(t.dataset.f, d); renderDrawer(true); return; }
  if (a === 'hsend') {
    const key = t.dataset.f, d = hintDraft(key), ta = $(`#drawer textarea[data-hdraft="${CSS.escape(key)}"]`), text = (ta ? ta.value : d.text).trim(); if (!text) { if (ta) ta.focus(); return; }
    const body = { kind: t.dataset.kind, scope: t.dataset.scope, claim_id: t.dataset.claim || null, critic: t.dataset.critic || null, text };
    api.post('/api/inbox', body).then(r => { if (r.ok) { LS.del(key); ui.form = null; toast(body.kind === 'analyst_hint' ? 'Hint is in the inbox; the analyst gets it as a hypothesis' : 'Dispute is in the inbox; the orchestrator hands it to the critic'); loadScope(); renderDrawer(true); refresh(true); } else toast(r.error || 'failed'); }).catch(() => toast('Server unreachable, the draft is kept'));
    return;
  }
  if (a === 'kbsend') {
    const ta = $('#kbtext'), text = ta.value.trim(); if (!text) { ta.focus(); return; }
    api.post('/api/inbox', { kind: 'knowledge', text, scopes: $('#kbscopes').value.split(',').map(x => x.trim()).filter(Boolean) }).then(r => { if (r.ok) { LS.del('dbcx.kbdraft'); ta.value = ''; $('#kbscopes').value = ''; toast('Knowledge is in the inbox'); refresh(true); } else toast(r.error || 'failed'); }).catch(() => toast('Server unreachable'));
    return;
  }
  if (a === 'ck') { $('#btnCk').click(); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (ui.drawer) closeDrawer(); else if (!$('#pop').hidden) $('#pop').hidden = true; else if (ui.dec && document.body.classList.contains('dec-overlay')) { ui.dec = false; renderDec(); renderTop(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.draft, hkey = e.target.dataset.hdraft;
  if (k) { const q = qById(k); if (!q) return; const d = draftOf(q); d.text = e.target.value; saveDraft(q, d); const b = e.target.closest('.q').querySelector('[data-act="q-send"]'); if (b) b.disabled = !d.option || (d.option === 'other' && !d.text.trim()); }
  if (hkey) { const d = hintDraft(hkey); d.text = e.target.value; LS.set(hkey, d); }
  if (e.target.dataset.gfb) { const d = gfbDraft(e.target.dataset.gfb); d.text = e.target.value; LS.set('dbcx.gfb.' + e.target.dataset.gfb, d); }
  if (e.target.id === 'kbtext') LS.set('dbcx.kbdraft', e.target.value);
  if (e.target.dataset.pedit && ui.pcell) { const k = 'dbcx.pedit.' + ui.pcell, d = LS.get(k, { text: '', reason: '' }); d[e.target.dataset.pedit] = e.target.value; LS.set(k, d); }
});
document.addEventListener('focusout', () => setTimeout(() => { if (renderDec.dirty && !typing($('#dec'))) renderDec(); }, 50));
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.matches) return;
  if (d.matches('details.grp')) { const g = d.dataset.g; d.open ? ui.closedGroups.delete(g) : ui.closedGroups.add(g); LS.set('dbcx.closedGroups', [...ui.closedGroups]); }
  if (d.matches('details.kbt')) { ui.kbOpen = ui.kbOpen || new Set(); d.open ? ui.kbOpen.add(d.dataset.kb) : ui.kbOpen.delete(d.dataset.kb); }
}, true);
$('#scrim').addEventListener('click', closeDrawer);
$('#btnDec').addEventListener('click', () => { ui.dec = !ui.dec; layout(); renderDec(true); renderTop(); });
$('#btnReport').addEventListener('click', () => { ui.tab = ui.drawer === '_report' ? ui.tab : 'report'; openDrawer('_report'); });
$('#btnAgents').addEventListener('click', () => { const p = $('#pop'); p.hidden = !p.hidden; $('#btnAgents').setAttribute('aria-expanded', !p.hidden); renderPop(); });
$('#btnPause').addEventListener('click', () => { const c = (S && S.control) || {}; c.pause_requested ? command('resume', 'Resume requested') : command('pause', 'Pause requested: no new agents will start'); });
$('#btnCk').addEventListener('click', () => command('checkpoint', 'Checkpoint requested: progress report and interim workbooks'));
function layout() { document.body.classList.toggle('dec-overlay', innerWidth < 1560); }
addEventListener('resize', () => { layout(); renderPop(); });

// ---------------------------------------------------------------- refresh loop: re-read the state on a timer, never reload the page
async function refresh(scope) {
  try { const s = await api.state(); if (!s || !s.analysts) throw new Error(s && s.error || 'no state'); S = s; lastOk = Date.now(); failed = false; everything(); if (ui.drawer && row(ui.drawer) && (scope || !drawerBusy())) loadScope(); }
  catch { failed = true; liveTick(); }
}
layout();
ui.dec = innerWidth >= 1560 || params.get('dec') === '1'; if (params.get('dec') === '0') ui.dec = false;
refresh().then(() => { if (params.get('scope')) openDrawer(params.get('scope')); if (params.get('q')) { ui.openQ.add(params.get('q')); renderDec(true); } });
setInterval(refresh, 8000); setInterval(liveTick, 1000);
})();
